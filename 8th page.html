<!DOCTYPE html>
<html>
    <head>
        <title>
            Class Attribute:
        </title>
    </head>
    <body>
        <p>
            Like id attribute, the class attribute is also used to identify elements. 
           <h3> But unlike id, the class attribute does not have to be unique in the document.</h3>
        </p>
        <br>
        <input type = "text" class = "highlight"> <br>
        <div class = "box highlight"> any content </div> <br>
        <p class = "highlight" > this is simply a paragraph </p> <br>
    </body>
</html>
